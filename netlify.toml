
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node 22.12 or newer
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/fonts/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "assets/images/*.svg"
    [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "assets/images/*"
    [headers.values]
    Cache-Control = "public, max-age=604800"
